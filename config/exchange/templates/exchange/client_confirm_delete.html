{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h3>Confirmar Eliminación</h3>
                </div>
                <div class="card-body">
                    <p>¿Estás seguro de que quieres eliminar al cliente "<strong>{{ client.name }}</strong>"?</p>
                    <p class="text-danger"><strong>¡Atención!</strong> Esta acción no se puede deshacer. Se eliminarán también todas las transacciones asociadas a este cliente.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Sí, estoy seguro. Eliminar.</button>
                        <a href="{% url 'client-list' %}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
